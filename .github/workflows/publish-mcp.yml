name: Publish existing npm version to MCP

# Recovery/bootstrap path: this workflow never publishes to npm.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-distribution
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tneemo/pkg' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/check-distribution.mjs --published
      - uses: ./.github/actions/setup-mcp-publisher
      - run: mcp-publisher validate server.json
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish server.json
      - run: node scripts/check-distribution.mjs --registry
