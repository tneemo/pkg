name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-distribution.mjs
      - uses: ./.github/actions/setup-mcp-publisher
      - run: mcp-publisher validate server.json
      - run: npm run typecheck
      - run: npm run build
      - name: Start a local registry and publish the example builds
        run: |
          echo "ADMIN_TOKEN=ci-admin-token" > registry/.dev.vars
          npm run dev > registry.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/search?q= > /dev/null && break; sleep 1; done
          PKG_REGISTRY=http://127.0.0.1:8787 PKG_TOKEN=ci-admin-token npm run seed
      - run: npm test
        env:
          PKG_REGISTRY: http://127.0.0.1:8787
